<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devriti - Feature Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="app-container">
        <header class="main-header">
            <div class="logo-container">
                <h1>Devriti</h1>
                <p class="subtitle">Empowering Mental Wellness</p>
            </div>
            <nav class="tab-nav">
                <button class="tab-btn active" data-tab="core" data-short="Core">Core Features</button>
                <button class="tab-btn" data-tab="ai" data-short="AI">AI Intelligence</button>
                <button class="tab-btn" data-tab="future" data-short="Future">Future Roadmap</button>
            </nav>
        </header>

        <main class="content-area">
            <!-- Core Features Tab -->
            <section id="core" class="tab-content active">
                <div class="features-grid">
                    <!-- Features will load from Supabase -->
                </div>
            </section>

            <!-- AI Intelligence Tab -->
            <section id="ai" class="tab-content">
                <div class="features-grid">
                    <!-- Features will load from Supabase -->
                </div>
            </section>

            <!-- Future Roadmap Tab -->
            <section id="future" class="tab-content">
                <div class="features-grid">
                    <!-- Features will load from Supabase -->
                </div>
            </section>
        </main>

        <footer class="main-footer">
            <p>&copy; 2025 Devriti. All rights reserved.</p>
        </footer>
    </div>

    <!-- Add Feature Modal -->
    <div id="addFeatureModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="window.DevritiSupabase.closeModals()">&times;</span>
            <h2>Add New Feature</h2>
            <form id="addFeatureForm">
                <div class="form-group">
                    <label>Feature Name</label>
                    <input type="text" id="featureName" placeholder="e.g., Mood Tracker" required>
                </div>
                <button type="submit" class="submit-btn">Add Feature</button>
            </form>
        </div>
    </div>

    <!-- Add Sub-Feature Modal -->
    <div id="addSubFeatureModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="window.DevritiSupabase.closeModals()">&times;</span>
            <h2>Add Feature Item</h2>
            <p id="subFeatureCardName" style="color: var(--accent-dark); margin-bottom: 1rem;"></p>
            <form id="addSubFeatureForm">
                <div class="form-group">
                    <label>Feature Description</label>
                    <textarea id="subFeatureText" placeholder="Enter feature description..." rows="3" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Add Item</button>
            </form>
        </div>
    </div>

    <!-- Edit Feature Modal -->
    <div id="editFeatureModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="window.DevritiSupabase.closeModals()">&times;</span>
            <h2>Edit Feature Name</h2>
            <form id="editFeatureForm">
                <div class="form-group">
                    <label>Feature Name</label>
                    <input type="text" id="editFeatureName" placeholder="Enter new name..." required>
                </div>
                <button type="submit" class="submit-btn">Update</button>
            </form>
        </div>
    </div>

    <!-- Edit Sub-Feature Modal -->
    <div id="editSubFeatureModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="window.DevritiSupabase.closeModals()">&times;</span>
            <h2>Edit Feature Item</h2>
            <form id="editSubFeatureForm">
                <div class="form-group">
                    <label>Feature Description</label>
                    <textarea id="editSubFeatureText" placeholder="Enter feature description..." rows="3" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Update</button>
            </form>
        </div>
    </div>

    <!-- Custom Confirmation Dialog -->
    <div id="confirmDialog" class="modal">
        <div class="modal-content confirm-dialog">
            <div class="confirm-icon">
                <i class="fa-solid fa-circle-question"></i>
            </div>
            <h2 id="confirmTitle">Confirm Action</h2>
            <p id="confirmMessage">Are you sure you want to proceed?</p>
            <div class="confirm-actions">
                <button class="cancel-btn" onclick="window.DevritiSupabase.cancelConfirm()">Cancel</button>
                <button class="confirm-btn" id="confirmBtn">Confirm</button>
            </div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script src="script.js"></script>
</body>

</html>
